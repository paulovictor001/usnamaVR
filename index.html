<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            font-family: Arial, sans-serif;

            text-align: center;
        }

    </style>

</head>

<body>

    <div id="status">
        📷 Iniciando câmera...
    </div>


    <!--
        Cena AR
    -->

    <a-scene

        mindar-image="
            imageTargetSrc: targets.mind;
        "

        embedded

        color-space="sRGB"

        renderer="
            colorManagement: true,
            physicallyCorrectLights
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="
            enabled: false
        "
    >

        <!-- Câmera -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!--
            Imagem reconhecida
        -->

        <a-entity
            mindar-image-target="targetIndex: 0"
        >

            <!-- Cubo 3D -->

            <a-box

                position="0 0 0.2"

                rotation="0 0 0"

                color="red"

                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 4000;
                    easing: linear
                "
            >

            </a-box>

        </a-entity>

    </a-scene>


    <script>

        const status =
            document.getElementById("status");


        /*
            Quando o MindAR encontrar
            a imagem
        */

        document.querySelector("a-scene")
            .addEventListener("targetFound", () => {

                status.innerText =
                    "🎯 Imagem encontrada!";

            });


        /*
            Quando a imagem sair da câmera
        */

        document.querySelector("a-scene")
            .addEventListener("targetLost", () => {

                status.innerText =
                    "🔎 Procurando imagem...";

            });


        /*
            Quando o AR estiver pronto
        */

        document.querySelector("a-scene")
            .addEventListener("arReady", () => {

                status.innerText =
                    "📷 Aponte para a imagem";

            });


        /*
            Erro
        */

        document.querySelector("a-scene")
            .addEventListener("arError", (event) => {

                console.error(event);

                status.innerText =
                    "❌ Erro ao iniciar AR";

            });

    </script>

</body>

</html>
