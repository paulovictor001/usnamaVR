<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste de Câmera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 20px;
        }

        #video {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 20px auto;
            background: #222;
        }

        #status {
            padding: 15px;
            font-size: 18px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Teste de câmera</h1>

    <div id="status">
        Clique no botão para iniciar a câmera.
    </div>

    <button id="start">
        📷 Abrir câmera
    </button>

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <script>
        const button = document.getElementById("start");
        const video = document.getElementById("video");
        const status = document.getElementById("status");

        button.addEventListener("click", async () => {

            try {

                status.innerText = "Solicitando acesso à câmera...";

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment"
                    },
                    audio: false
                });

                video.srcObject = stream;

                status.innerText = "✅ Câmera funcionando!";

            } catch (error) {

                console.error(error);

                status.innerText =
                    "❌ Erro: " +
                    error.name +
                    " - " +
                    error.message;
            }

        });
    </script>

</body>
</html>
