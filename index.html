<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WebAR - Teste</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #ar-container {
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            padding: 10px 16px;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 14px;

            text-align: center;
        }
    </style>
</head>

<body>

    <div id="status">
        Iniciando câmera...
    </div>

    <div id="ar-container"></div>


    <!-- Three.js -->
    <script type="module">

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js";

        import { MindARThree } from
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


        // --------------------------------
        // ELEMENTOS
        // --------------------------------

        const container = document.querySelector("#ar-container");
        const status = document.querySelector("#status");


        // --------------------------------
        // MINDAR
        // --------------------------------

        const mindarThree = new MindARThree({
            container: container,

            imageTargetSrc: "./targets.mind"
        });


        // --------------------------------
        // THREE.JS
        // --------------------------------

        const { renderer, scene, camera } = mindarThree;


        // Luz
        const light = new THREE.HemisphereLight(
            0xffffff,
            0xbbbbbb,
            3
        );

        scene.add(light);


        // --------------------------------
        // CUBO
        // --------------------------------

        const geometry = new THREE.BoxGeometry(
            0.5,
            0.5,
            0.5
        );

        const material = new THREE.MeshStandardMaterial({
            color: 0xff0000
        });

        const cube = new THREE.Mesh(
            geometry,
            material
        );


        // --------------------------------
        // TARGET
        // --------------------------------

        const anchor = mindarThree.addAnchor(0);

        anchor.group.add(cube);


        // --------------------------------
        // EVENTOS
        // --------------------------------

        anchor.onTargetFound = () => {

            status.innerText = "Imagem encontrada!";

        };


        anchor.onTargetLost = () => {

            status.innerText = "Procurando imagem...";

        };


        // --------------------------------
        // INICIAR AR
        // --------------------------------

        try {

            await mindarThree.start();

            status.innerText =
                "Aponte a câmera para a imagem";

            renderer.setAnimationLoop(() => {

                cube.rotation.y += 0.01;

                renderer.render(
                    scene,
                    camera
                );

            });

        } catch (error) {

            console.error(error);

            status.innerText =
                "Erro ao iniciar a câmera";

        }

    </script>

</body>

</html>
