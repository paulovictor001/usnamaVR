<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WebAR - Teste</title>


    <!-- ================================= -->
    <!-- IMPORT MAP -->
    <!-- ================================= -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>


    <!-- ================================= -->
    <!-- CSS -->
    <!-- ================================= -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

        }


        #ar-container {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        #status {

            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            padding: 10px 16px;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            font-size: 14px;

            text-align: center;

        }


        /*
         * Vídeo da câmera
         */

        #ar-container video {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            object-fit: cover !important;

            z-index: 1 !important;

        }


        /*
         * Canvas do Three.js
         */

        #ar-container canvas {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            z-index: 2 !important;

        }

    </style>

</head>


<body>


    <!-- ================================= -->
    <!-- STATUS -->
    <!-- ================================= -->

    <div id="status">

        Iniciando câmera...

    </div>


    <!-- ================================= -->
    <!-- CONTAINER AR -->
    <!-- ================================= -->

    <div id="ar-container"></div>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script type="module">

        import * as THREE from "three";

        import { MindARThree } from
            "mindar-image-three";


        // =================================
        // ELEMENTOS
        // =================================

        const container =
            document.getElementById("ar-container");


        const status =
            document.getElementById("status");


        // =================================
        // MINDAR
        // =================================

        const mindarThree =
            new MindARThree({

                container: container,

                imageTargetSrc: "./targets.mind"

            });


        // =================================
        // THREE.JS
        // =================================

        const {

            renderer,
            scene,
            camera

        } = mindarThree;


        // =================================
        // RENDERER
        // =================================

        renderer.setPixelRatio(
            window.devicePixelRatio
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        // Deixar o canvas transparente

        renderer.setClearColor(
            0x000000,
            0
        );


        // =================================
        // LUZ
        // =================================

        const light =
            new THREE.HemisphereLight(
                0xffffff,
                0xbbbbbb,
                3
            );


        scene.add(light);


        // =================================
        // CUBO 3D
        // =================================

        const geometry =
            new THREE.BoxGeometry(
                0.5,
                0.5,
                0.5
            );


        const material =
            new THREE.MeshStandardMaterial({

                color: 0xff0000

            });


        const cube =
            new THREE.Mesh(
                geometry,
                material
            );


        // =================================
        // TARGET
        // =================================

        const anchor =
            mindarThree.addAnchor(0);


        anchor.group.add(cube);


        // =================================
        // TARGET ENCONTRADO
        // =================================

        anchor.onTargetFound = () => {

            console.log(
                "🎯 Target encontrado!"
            );


            status.innerText =
                "🎯 Imagem encontrada!";

        };


        // =================================
        // TARGET PERDIDO
        // =================================

        anchor.onTargetLost = () => {

            console.log(
                "🔎 Target perdido!"
            );


            status.innerText =
                "🔎 Procurando imagem...";

        };


        // =================================
        // INICIAR AR
        // =================================

        try {

            status.innerText =
                "📷 Iniciando câmera...";


            await mindarThree.start();


            console.log(
                "✅ MindAR iniciado!"
            );


            // =================================
            // VÍDEO
            // =================================

            const video =
                container.querySelector("video");


            if (video) {

                console.log(
                    "✅ Vídeo da câmera encontrado!"
                );


                video.style.position =
                    "fixed";

                video.style.top =
                    "0";

                video.style.left =
                    "0";

                video.style.width =
                    "100%";

                video.style.height =
                    "100%";

                video.style.objectFit =
                    "cover";

                video.style.zIndex =
                    "1";

            }


            // =================================
            // STATUS
            // =================================

            status.innerText =
                "📷 Aponte para a imagem";


            // =================================
            // LOOP
            // =================================

            renderer.setAnimationLoop(() => {

                cube.rotation.y += 0.01;


                renderer.render(
                    scene,
                    camera
                );

            });


        } catch (error) {

            console.error(
                "❌ Erro ao iniciar AR:",
                error
            );


            status.innerText =
                "❌ Erro ao iniciar AR";

        }


        // =================================
        // RESIZE
        // =================================

        window.addEventListener(
            "resize",
            () => {

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>

</html>
